  - scope: {path: "iptv-smart-tv-setup.md"}
    values:
      description: "How to watch IPTV on a Samsung, LG, Sony, TCL or Hisense Smart TV in 2026: which player apps work, step-by-step setup, and when to use a Firestick instead."
      faq_key: smarttv
  - scope: {path: "xtream-codes-vs-m3u.md"}
    values:
      description: "Xtream Codes vs M3U explained: what each IPTV login is, how they differ for the TV guide, movies and updates, and which one to use in TiviMate, Smarters or VLC."
