title: IPTV Guides
description: Step-by-step IPTV setup for Firestick, Android TV and Smart TV with TiviMate, IPTV Smarters, Xtream Codes and M3U. Written by the Ark IPTV team.
theme: jekyll-theme-minimal
lang: en
url: https://iptv-guides.github.io
baseurl: /iptv-firestick-setup-guide
author: Ark IPTV team
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: {path: "README.md"}
    values:
      description: "How to set up IPTV on a Firestick, Android TV or Smart TV in 2026: install TiviMate or IPTV Smarters, add an Xtream Codes or M3U login, and fix common errors."
