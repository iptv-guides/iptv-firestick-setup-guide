setup:
  - q: "Which app is best, TiviMate or IPTV Smarters?"
    a: "TiviMate has a polished guide and recording features, Smarters is simple and works across more platforms. Both accept Xtream Codes and M3U."
  - q: "Do I need a VPN?"
    a: "Not required for setup. Some people use one for privacy. If your ISP slows streaming at peak times, a test with and without a VPN will show whether it helps for you."
  - q: "Does IPTV work on more than one device?"
    a: "Depends on the plan. Ark IPTV plans cover 1, 2, 3 or 4 devices."
  - q: "How fast is activation?"
    a: "Login details are emailed automatically after payment."
  - q: "What if a channel doesn't load?"
    a: "Follow the checklist in section 5, and contact support with the channel name and the time."
buffering:
  - q: "Why does my IPTV buffer only at night?"
    a: "Evenings are peak time on home and ISP networks. Test your speed at that time; if it drops a lot, use Ethernet, pause other downloads, and lower the stream quality."
  - q: "Does a VPN stop IPTV buffering?"
    a: "Only if your ISP is slowing streaming traffic. Test the same channel with and without a VPN at the same time of day and keep whichever is smoother."
  - q: "What internet speed do I need for IPTV?"
    a: "Around 15 Mbps of steady speed for HD and 25 Mbps or more for Full HD or 4K, per screen streaming at the same time."
  - q: "Why does IPTV freeze but the sound keeps playing?"
    a: "The device is struggling to decode the video. Clear the cache, close other apps, lower the quality, or switch the player's decoder in the app settings."
smarttv:
  - q: "Can I watch IPTV on a Samsung Smart TV without a Firestick?"
    a: "Yes, if your model's app store has an IPTV player that supports Xtream Codes or M3U. Availability depends on the model year and region. If there isn't one, a Firestick or Android TV box is the simplest option."
  - q: "Which IPTV app is best for LG Smart TVs?"
    a: "Look in the LG Content Store for a player that supports Xtream Codes or M3U and has recent updates and reviews. If none works well on your model, use a streaming stick with TiviMate or IPTV Smarters."
  - q: "Is TiviMate available on Samsung or LG TVs?"
    a: "No. TiviMate is made for Android TV and Fire TV. On Samsung and LG, use a player from the TV's own store, or add a Firestick or Android box."
  - q: "Why does my Smart TV IPTV app ask for a MAC address?"
    a: "Some Smart TV players link your playlist to the TV's device ID or MAC address. You add your login on the app's official website, and the TV downloads it."
xtream:
  - q: "Is Xtream Codes better than M3U?"
    a: "For dedicated apps like TiviMate and IPTV Smarters, usually yes: the TV guide, movies and series load automatically and stay organised. M3U is better only when your app doesn't support Xtream Codes."
  - q: "Can I convert an M3U link into Xtream Codes?"
    a: "Often yes. Everything before /get.php is the server URL, and the username and password are in the link after username= and password=."
  - q: "Why does my M3U playlist have no TV guide?"
    a: "M3U often loads only the channels. Add the separate EPG link from your provider in the app's playlist settings, then update the guide."
  - q: "Do Xtream Codes and M3U give different channels?"
    a: "No. They are two ways of logging in to the same subscription. The difference is how the app organises and updates what you get."
